name: Plan Identity Write Test

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  write-test:
    runs-on: ubuntu-latest
    env:
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
    steps:
      - name: Attempt a write as the plan identity
        run: |
          id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::$id_token"

          token=$(curl -sS -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion=$id_token" | jq -r .access_token)
          echo "::add-mask::$token"

          roles=$(python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; print(",".join(sorted(json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))).get("roles",[]))))' "$token")
          echo "Token roles: $roles"

          read_code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            'https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies?$select=id&$top=1')
          echo "Read status: $read_code"
          if [ "$read_code" != "200" ]; then
            echo "::error::Read failed, so this run proves nothing about writes"
            exit 1
          fi

          body='{"displayName":"ZZ write test - delete me","state":"disabled","conditions":{"clientAppTypes":["all"],"applications":{"includeApplications":["None"]},"users":{"includeUsers":["None"]}},"grantControls":{"operator":"OR","builtInControls":["block"]}}'
          write_code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$body" \
            'https://graph.microsoft.com/v1.0/identity/conditionalAccess/policies')
          echo "Write status: $write_code"

          if [ "$write_code" = "403" ]; then
            echo "PASS: the plan identity cannot write" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Expected 403 but got $write_code"
          jq -r '.id // .error.code // empty' response.json
          exit 1
